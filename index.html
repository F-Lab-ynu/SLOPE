<style>
:root{
  /* black base. white = selected / done, red = act now, grey = inactive. one phone-width column. */
  --bg:var(--bg); --surface:var(--n6); --line:var(--n15); --text:var(--fg); --muted:var(--n68);
  --red:#E60023; --red-text:#FF4D5E;
  --latin:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{font-family:'Zen Kaku Gothic New','Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif}
@media (display-mode: standalone){html{height:auto;min-height:calc(100% + env(safe-area-inset-top))}} /* iPhone：上のバーを透明にしたとき下に隙間ができるのを防ぐ */
html:has(body.desk),body.desk{background:var(--bg)}
*{-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:50%;top:50%;width:390px;height:var(--h);transform-origin:center center}
body.desk #stage{border-radius:44px;overflow:hidden;box-shadow:0 0 0 8px var(--bg),0 0 0 9px var(--n22),0 30px 80px rgba(0,0,0,.6)}
#stage .app{height:var(--h) !important}
.scroll{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.app *{box-sizing:border-box}
.app button{font:inherit;cursor:pointer;transition:opacity .12s}
.app button:not(:disabled):active{opacity:.7}
.app button:disabled{cursor:default}
.app button:focus-visible,.app input:focus-visible,.app textarea:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.app input,.app textarea{font:inherit}
.app input::placeholder,.app textarea::placeholder{color:var(--n49)}
.app h1,.app h2{word-break:auto-phrase}
.app button.chip{font-size:13px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lbl{font-size:12px;letter-spacing:0.06em;color:var(--n78);font-family:var(--latin);text-transform:uppercase;font-weight:600}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid var(--n22);color:var(--n86);white-space:nowrap}
.h2{font-size:18px;font-weight:700;margin:0;color:var(--text)}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center}
.en{font-family:var(--latin);font-variant-numeric:tabular-nums}
.grid{background-color:var(--n4);background-size:18px 18px}

a{color:var(--text)}a:hover{color:var(--red-text)}
@media (prefers-reduced-motion:reduce){.app *{transition:none !important}}

/* trial theme: warm black, off-white, amber as the only accent */
:root{--bg:var(--bg);--surface:var(--n5);--line:var(--n11);--text:var(--fg);--muted:var(--n66);--red-text:var(--ac);--accent:var(--ac)}
html:has(body.desk),body.desk{background:var(--bg)}
body.desk #stage{box-shadow:0 0 0 8px var(--bg),0 0 0 9px var(--n18),0 30px 80px rgba(0,0,0,.7)}
.app{background:var(--bg) !important}
.card{border-radius:10px}
.h2{display:flex;align-items:center;gap:9px}
.h2::before{content:"";flex:none;width:3px;height:15px;border-radius:2px;background:var(--accent)}
.lbl{letter-spacing:.1em;color:var(--n66)}
.chip{border-color:var(--n21);color:var(--n85)}
.big{font-family:'Barlow Condensed','Barlow','Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
.app h1{letter-spacing:-0.01em}
.app input::placeholder,.app textarea::placeholder{color:var(--n49)}
.grid{background-color:var(--n2)}
.app button:disabled{opacity:.35}
.tv,.tv *{color-scheme:normal}
.tv iframe{background:transparent}

/* mode switch (member <-> admin), same control in both pages */
html,body{overscroll-behavior:none}
.msw{position:relative;width:44px;height:26px;border-radius:13px;border:0;padding:0;background:var(--n22);cursor:pointer;flex:none;transition:background .16s}
.msw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .16s}
.msw.on{background:#2563EB}
.msw.on i{transform:translateX(18px)}
.mode{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--n66);margin-right:6px}
/* PC layout */
#wchrome{display:none}
#wchrome,#wchrome *{box-sizing:border-box}
body.wide{background:var(--bg)}
body.wide #stage{left:0;top:0;width:auto;right:0;bottom:0;height:auto;transform:none !important;border-radius:0;box-shadow:none}
body.wide #stage .app{width:100% !important;height:100vh !important;display:grid !important;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
body.wide .app > header{grid-column:2;grid-row:1}
body.wide .app > main{grid-column:2;grid-row:2}
body.wide .app > main > *{max-width:760px;margin-left:auto !important;margin-right:auto !important}
body.wide .app > header .mark,body.wide .app > header .mark + .en,body.wide .app > header button[aria-label="マイページ"],body.wide .app > header .mode{display:none !important}
body.wide .app > nav{grid-column:1;grid-row:1 / span 2;height:auto !important;display:flex !important;flex-direction:column;gap:2px;border-top:0 !important;border-right:1px solid var(--n9);padding:76px 12px 140px !important}
body.wide .app > nav button{flex-direction:row !important;justify-content:flex-start !important;gap:12px !important;height:42px;padding:0 12px;border-top:0 !important;border-radius:6px;font-size:14px !important}
body.wide .app > nav button:not([style*="solid transparent"]){background:var(--n8)}
body.wide #wchrome{display:block}
#wchrome .wlogo{position:fixed;left:0;top:0;width:232px;height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;z-index:5}
#wchrome .wlogo b{font-family:var(--latin);letter-spacing:.16em;font-size:17px;color:var(--fg)}
#wchrome .wacct{position:fixed;left:0;bottom:0;width:232px;padding:10px 12px 14px;border-top:1px solid var(--n9);display:flex;flex-direction:column;gap:6px;z-index:5;background:var(--bg)}
#wchrome .mode{justify-content:space-between;padding:4px 8px;margin:0}
#wchrome .wme{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:6px;background:transparent;color:var(--fg);text-align:left;font:inherit;cursor:pointer}
#wchrome .wme:hover{background:var(--n8)}
#wchrome .wme .av{width:30px;height:30px;border-radius:50%;background:var(--n16);border:1.5px solid var(--n27);display:flex;align-items:center;justify-content:center;font-family:var(--latin);font-size:12px;font-weight:700}
#wchrome .wme small{display:block;font-size:12px;color:var(--n66)}
html,body{touch-action:manipulation}
.crsw{display:flex;flex-direction:column;gap:20px}
.crsl{display:flex;flex-direction:column;gap:20px;min-width:0}
body.wide .crsw{display:flex;flex-direction:row;gap:24px;align-items:flex-start}
body.wide .crsl{flex:0 1 auto}
body.wide .crsr{flex:0 0 340px}
body.wide .crsr{position:sticky;top:16px}
body.wide .app > main > .crspg{max-width:1160px}

/* プログラム（入れ子＋左の1本のバー） */
#progTree,#progList{max-width:720px}
.pgtree{display:flex;flex-direction:column}
.pgb{display:flex;gap:16px;align-items:stretch}
.pgrail{position:relative;width:8px;flex:none;border:0;padding:0;margin:0;background:transparent}
button.pgrail{cursor:pointer}
button.pgrail::before{content:"";position:absolute;inset:0 -10px}
.pgrail .rr,.pgrail .rd{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;display:block}
.pgrail .rd{bottom:auto;width:6px;background:var(--fg)}

  var day = function (iso) { var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); return (+p[1]) + '月' + (+p[2]) + '日（' + WD[d.getDay()] + '）'; };
  var BACK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  function page(id) {
    var D = window.DB; if (!D) return; var x = D.items('cal').filter(function (y) { return y.id === id; })[0]; if (!x) return;
    var d = x.data || {}, ok = /^\d{4}-\d{2}-\d{2}$/.test(d.date || ''), on = D.mine(id, 'join'), old = document.getElementById('evpage');
    var when = ok ? day(d.date) + (d.to && d.to !== d.date ? ' – ' + day(d.to) : '') : '日程未定';
    var h = '<div class="nsph"><button data-evp-back aria-label="戻る">' + BACK + '</button><b>部内イベント</b></div><div class="nspb evpb">' +
      '<h1>' + e(d.title) + '</h1>' +
      '<dl class="evpm"><dt>日にち</dt><dd>' + e(when) + '</dd>' + (d.time ? '<dt>時間</dt><dd>' + e(d.time) + '</dd>' : '') + (d.place ? '<dt>場所</dt><dd>' + e(d.place) + '</dd>' : '') + '</dl>' +
      (d.memo ? '<div class="evpd">' + link(d.memo) + '</div>' : '') +
      (/^https?:\/\//.test(d.link || '') ? '<a class="evpl" href="' + e(d.link) + '" target="_blank" rel="noopener">リンクを開く ↗</a>' : '') + '</div>' +
      (ok ? '<div class="evpf"><button class="evpj' + (on ? ' on' : '') + '" data-evp-join="' + e(id) + '">' + (on ? '✓ 参加登録済み' : '参加登録する') + '</button></div>' : '');
    var w = old || document.createElement('div'); w.id = 'evpage'; w.innerHTML = h;
    if (!old) { document.body.appendChild(w); document.documentElement.classList.add('invon'); try { history.pushState({ evp: 1 }, ''); } catch (er) {} }
  }
  function close(fromPop) { var w = document.getElementById('evpage'); if (!w) return; w.remove(); document.documentElement.classList.remove('invon'); if (!fromPop) try { if (history.state && history.state.evp) history.back(); } catch (er) {} }
  window.addEventListener('popstate', function () { close(true); });
  document.addEventListener('click', function (ev) {
    var t = ev.target; if (!t.closest) return; var b;
    if (t.closest('[data-evp-back]')) { close(); return; }
    if ((b = t.closest('[data-evp-join]'))) { var id = b.dataset.evpJoin; Promise.resolve(window.DB.toggle(id, 'join')).then(function () { setTimeout(function () { page(id); }, 50); }); return; }
    var c = t.closest('[data-evid]'); if (!c || t.closest('button, a')) return;
    page(c.dataset.evid);
  });
})();

// PC の左下アカウント表示を本人の情報に
window.__chrome = function () { var D = window.DB; if (!D || !D.self) return; var a = document.getElementById('wAv'), n = document.getElementById('wName'), sb2 = document.getElementById('wSub'), m = document.getElementById('wMode');
  if (a) a.textContent = D.ini(D.me); if (n) n.textContent = D.self.name; if (sb2) sb2.textContent = D.self.grade || ''; if (m) m.style.display = D.isOps() ? '' : 'none'; };
setInterval(window.__chrome, 400);

<script>

  var HOLE=/\{\{\s*([^}]+?)\s*\}\}/g, WHOLE=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
