<style>
:root{
  /* black base. white = selected / done, red = act now, grey = inactive. one phone-width column. */
  --bg:#0A0A0A; --surface:#161616; --line:#2B2B2B; --text:#F5F5F5; --muted:#A6A6A6;
  --red:#E60023; --red-text:#FF4D5E;
  --latin:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
html:has(body.desk),body.desk{background:#050505}
*{-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:50%;top:50%;width:390px;height:var(--h);transform-origin:center center}
body.desk #stage{border-radius:44px;overflow:hidden;box-shadow:0 0 0 8px #0A0A0A,0 0 0 9px #3A3A3A,0 30px 80px rgba(0,0,0,.6)}
#stage .app{height:var(--h) !important}
.scroll{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.app *{box-sizing:border-box}
.app button{font:inherit;cursor:pointer;transition:opacity .12s}
.app button:not(:disabled):active{opacity:.7}
.app button:disabled{cursor:default}
.app button:focus-visible,.app input:focus-visible,.app textarea:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.app input,.app textarea{font:inherit}
.app input::placeholder,.app textarea::placeholder{color:#7A7A7A}
.app h1,.app h2{word-break:auto-phrase}
.app button.chip{font-size:13px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.lbl{font-size:12px;letter-spacing:0.06em;color:#BDBDBD;font-family:var(--latin);text-transform:uppercase;font-weight:600}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid #3A3A3A;color:#D0D0D0;white-space:nowrap}
.h2{font-size:18px;font-weight:700;margin:0;color:var(--text)}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center}
.en{font-family:var(--latin);font-variant-numeric:tabular-nums}
.grid{background-color:#101010;background-size:18px 18px}

/* trial theme: warm black, off-white, amber as the only accent */
:root{--bg:#070707;--surface:#131313;--line:#222221;--text:#F3F1EC;--muted:#A3A19B;--red-text:#F2A93B;--accent:#F2A93B}
html:has(body.desk),body.desk{background:#020202}
body.desk #stage{box-shadow:0 0 0 8px #070707,0 0 0 9px #33322F,0 30px 80px rgba(0,0,0,.7)}
.app{background:#070707 !important}
.card{border-radius:10px}
.h2{display:flex;align-items:center;gap:9px}
.h2::before{content:"";flex:none;width:3px;height:15px;border-radius:2px;background:var(--accent)}
.lbl{letter-spacing:.1em;color:#A3A19B}
.chip{border-color:#383836;color:#D2CFC8}
.big{font-family:'Barlow Condensed','Barlow','Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums}
.app h1{letter-spacing:-0.01em}
.app input::placeholder,.app textarea::placeholder{color:#7D7B76}
.grid{background-color:#0C0C0C}
.app button:disabled{opacity:.35}
.tv,.tv *{color-scheme:normal}
.tv iframe{background:transparent}

/* mode switch (member <-> admin), same control in both pages */
html,body{overscroll-behavior:none}
.msw{position:relative;width:44px;height:26px;border-radius:13px;border:0;padding:0;background:#3A3A38;cursor:pointer;flex:none;transition:background .16s}
.msw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#F3F1EC;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .16s}
.msw.on{background:#2563EB}
.msw.on i{transform:translateX(18px)}
.mode{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#A3A19B;margin-right:6px}
/* PC layout */
#wchrome{display:none}
#wchrome,#wchrome *{box-sizing:border-box}
body.wide{background:#070707}
body.wide #stage{left:0;top:0;width:auto;right:0;bottom:0;height:auto;transform:none !important;border-radius:0;box-shadow:none}
body.wide #stage .app{width:100% !important;height:100vh !important;display:grid !important;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
body.wide .app > header{grid-column:2;grid-row:1}
body.wide .app > main{grid-column:2;grid-row:2}
body.wide .app > main > *{max-width:760px;margin-left:auto !important;margin-right:auto !important}
body.wide .app > header .mark,body.wide .app > header .mark + .en,body.wide .app > header button[aria-label="マイページ"],body.wide .app > header .mode{display:none !important}
body.wide .app > nav{grid-column:1;grid-row:1 / span 2;height:auto !important;display:flex !important;flex-direction:column;gap:2px;border-top:0 !important;border-right:1px solid #1C1C1B;padding:76px 12px 140px !important}
body.wide .app > nav button{flex-direction:row !important;justify-content:flex-start !important;gap:12px !important;height:42px;padding:0 12px;border-top:0 !important;border-radius:6px;font-size:14px !important}
body.wide .app > nav button:not([style*="solid transparent"]){background:#191918}
body.wide #wchrome{display:block}
#wchrome .wlogo{position:fixed;left:0;top:0;width:232px;height:64px;display:flex;align-items:center;gap:10px;padding:0 20px;z-index:5}
#wchrome .wlogo b{font-family:var(--latin);letter-spacing:.16em;font-size:17px;color:#F3F1EC}
#wchrome .wacct{position:fixed;left:0;bottom:0;width:232px;padding:10px 12px 14px;border-top:1px solid #1C1C1B;display:flex;flex-direction:column;gap:6px;z-index:5;background:#070707}
#wchrome .mode{justify-content:space-between;padding:4px 8px;margin:0}
#wchrome .wme{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:6px;background:transparent;color:#F3F1EC;text-align:left;font:inherit;cursor:pointer}
#wchrome .wme:hover{background:#191918}
#wchrome .wme .av{width:30px;height:30px;border-radius:50%;background:#2C2C2A;border:1.5px solid #474744;display:flex;align-items:center;justify-content:center;font-family:var(--latin);font-size:12px;font-weight:700}
#wchrome .wme small{display:block;font-size:12px;color:#A3A19B}
html,body{touch-action:manipulation}
.crsw{display:flex;flex-direction:column;gap:20px}
.crsl{display:flex;flex-direction:column;gap:20px;min-width:0}
body.wide .crsw{display:flex;flex-direction:row;gap:24px;align-items:flex-start}
body.wide .crsl{flex:0 1 auto}
body.wide .crsr{flex:0 0 340px}
body.wide .crsr{position:sticky;top:16px}
body.wide .app > main > .crspg{max-width:1160px}

/* プログラム（入れ子＋左の1本のバー） */
#progTree,#progList{max-width:720px}
.pgtree{display:flex;flex-direction:column}
.pgb{display:flex;gap:16px;align-items:stretch}
.pgrail{position:relative;width:8px;flex:none;border:0;padding:0;margin:0;background:transparent}
button.pgrail{cursor:pointer}
button.pgrail::before{content:"";position:absolute;inset:0 -10px}
.pgrail .rr,.pgrail .rd{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;display:block}
.pgrail .rd{bottom:auto;width:6px;background:#F3F1EC}
.pgb:first-child .pgrail .rr,.pgb:first-child .pgrail .rd{border-top-left-radius:3px;border-top-right-radius:3px}
.pgb:last-child .pgrail .rr{border-bottom-left-radius:3px;border-bottom-right-radius:3px}
.pgbody{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:10px}
.pgbh{display:flex;align-items:center;gap:8px;width:100%;padding:8px 0 2px;background:transparent;border:0;color:#F3F1EC;text-align:left;font:inherit}
.pgbn{font-size:15px;font-weight:700;flex:1;min-width:0}
.pgsc{font-size:12px;color:#7D7B76;flex:none}
.pgu{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 0;background:transparent;border:0;color:#F3F1EC;text-align:left;font:inherit;text-decoration:none}
.pgu+.pgu,.pgsub+.pgu,.pgu+.pgsub{border-top:1px solid #1C1C1B}
.pgd{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #474744;box-sizing:border-box}
.pgd.done{background:#F3F1EC;border-color:#F3F1EC}.pgd.open{border-color:#BDBAB3}.pgd.locked{border-color:#2C2C2A}
.pgu.cur .pgd{border-color:#F2A93B;background:rgba(242,169,59,.25)}
.pgt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pgc{font-size:11px;color:#7D7B76;letter-spacing:.04em}
.pgn{font-size:15px;font-weight:600;line-height:1.4}
.pgu.tr .pgn,.pgu.ev .pgn{font-size:17px;font-weight:700}
.pgu .pgd.locked+.pgt .pgn,.pgu.dim .pgn{color:#7D7B76}
.pgm{font-size:13px;color:#A3A19B;line-height:1.5;margin-top:2px}
.pgr{flex:none}
.pgk{position:absolute;left:-27px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#F2A93B;box-shadow:0 0 0 3px #070707,0 0 12px rgba(242,169,59,.6);z-index:1}
.pgsub{border-top:1px solid #1C1C1B}
.pgsub.top,.pgb>.pgbody>.pgsub:first-child{border-top:0}
.pgsh{display:flex;align-items:center;gap:8px;width:100%;padding:10px 0 2px;background:transparent;border:0;color:#BDBAB3;text-align:left;font:inherit}
.pgsn{font-size:13px;font-weight:700;flex:1;min-width:0}
.pgin{border-left:1px solid #2C2C2A;margin-left:9px;padding-left:12px}
.pgin.any{border-left-style:dashed}
.pgin .pgk{left:-49px}
.pgin .pgin .pgk{left:-71px}
.pglk{display:inline-flex;margin-right:2px}
.pgsub.lk>.pgsh .pgsn,.pgu .pgd.locked+.pgt .pgn{color:#7D7B76}
.pgch{flex:none;transition:transform .15s}
.pgkn{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#F2A93B;box-shadow:0 0 0 3px #070707,0 0 12px rgba(242,169,59,.6);z-index:1}
.pgout{display:flex;flex-direction:column;border-top:1px solid #1C1C1B;border-bottom:1px solid #1C1C1B;margin-bottom:8px}
.pgout .pgu{min-height:50px}

/* 見やすく：見出し 18 ＞ 小見出し 15 ＞ やること 14。やることの状態はバーの上の点で */
.pgbh{padding:14px 0 4px !important;min-height:0}
.pgb>.pgbody>.pgbh:first-child{padding-top:2px !important}
.pgbn{font-size:18px !important;font-weight:700;color:#F3F1EC;flex:1}
.pgsh{min-height:40px;padding:10px 0 2px !important;border-top:0 !important}
.pgsn{font-size:15px !important;font-weight:700 !important;color:#D2CFC8 !important;flex:1;min-width:0}
.pgsub{border-top:0 !important}
.pgsub.lk>.pgsh .pgsn{color:#7D7B76 !important}
.pgin{border-left:0 !important;margin-left:0 !important;padding-left:14px !important}
.pglk{display:inline-flex;align-items:center;flex:none;margin:0 2px}

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A19B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="単元を検索" placeholder="単元を検索" onInput="{{ setUq }}" style="flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; color: #F3F1EC; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<button onClick="{{ dd.u.tg }}" aria-expanded="{{ dd.u.open }}" style="align-self: flex-start; height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #383836; border-radius: 8px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg><span>状態：<b style="color: #F3F1EC; font-weight: 700">{{ dd.u.cur }}</b></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ dd.u.rot }}); transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ dd.u.open }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; min-width: 200px; padding: 4px 0; background: #191918; border: 1px solid #383836; border-radius: 8px">
<sc-for list="{{ dd.u.items }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="width: 100%; height: 42px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: transparent; border: 0; color: #F3F1EC; font-size: 14px; text-align: left">{{ o.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ o.chk }}"><path d="M5 12l5 5 9-10"></path></svg></button>
</sc-for>
</div>
</sc-if>
</div>
<sc-for list="{{ unitGroups }}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span class="en" style="font-size: 14px; font-weight: 700; letter-spacing: 0.04em">{{ g.name }}</span>
</div>
<div class="card" style="border-radius: 10px; overflow: hidden">
<sc-for list="{{ g.items }}" as="u" hint-placeholder-count="3">
<button onClick="{{ u.open }}" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; background: transparent; border: 0; border-bottom: {{ u.sep }}; color: #F3F1EC; text-align: left">
<span style="flex: none; box-sizing: border-box; width: 10px; height: 10px; border-radius: 50%; background: {{ u.dotBg }}; border: 2px solid {{ u.dotBd }}"></span>
<span class="en" style="flex: none; width: 54px; font-size: 13px; color: #A3A19B; font-weight: 500">{{ u.code }}</span>
<span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; color: {{ u.fg }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ u.title }}</span>
<sc-if value="{{ u.practice }}" hint-placeholder-val="{{ false }}"><span class="chip" style="flex: none; height: 22px; padding: 0 8px; font-size: 12px; border-color: #8C8C8C; color: #D0D0D0">実習</span></sc-if>
<sc-if value="{{ u.shared }}" hint-placeholder-val="{{ false }}"><span class="chip" style="flex: none; height: 22px; padding: 0 8px; font-size: 12px; border-color: #F3F1EC; color: #F3F1EC">共通</span></sc-if>
<span style="flex: none; font-size: 13px; color: {{ u.stColor }}">{{ u.status }}</span>
</button>
</sc-for>
</div>
</div>
</sc-for>
<sc-if value="{{ noUnits }}" hint-placeholder-val="{{ false }}">
<div class="card" style="padding: 18px; font-size: 14px; color: #A3A19B; text-align: center">該当する単元はありません</div>
</sc-if>
</div>
</sc-if>


<sc-if value="{{ show.unit }}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">{{ unit.head }}</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700">{{ unit.title }}</h1>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span class="chip">{{ unit.deps }}</span><sc-if value="{{ unit.inperson }}"><span class="chip">対面の演習会あり</span></sc-if>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px"><span class="en" style="font-size: 13px; font-weight: 700; color: #070707; background: #F3F1EC; padding: 2px 8px; border-radius: 6px">INPUT</span><span style="font-size: 14px; color: #BDBAB3">教材</span></div>
<sc-if value="{{ unit.noMaterials }}"><div style="font-size: 14px; color: #A3A19B">教材はまだ登録されていません</div></sc-if>
<sc-for list="{{ materials }}" as="m" hint-placeholder-count="3">
<button onClick="{{ m.go }}" class="card" style="padding: 14px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; color: #F3F1EC">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 500">{{ m.title }}</span>
<span style="font-size: 13px; color: #A3A19B">{{ m.kind }} · {{ m.min }}</span>
</span>
<span class="chip" style="border-color: {{ m.color }}; color: {{ m.color }}">開く ↗</span>
</button>
</sc-for>
</div>

<button onClick="{{ unit.toggle }}" style="height: 48px; border: 1px solid #F3F1EC; border-radius: 8px; background: {{ unit.doneBg }}; color: {{ unit.doneFg }}; font-weight: 700; font-size: 16px">{{ unit.doneLabel }}</button>

<div class="card" style="padding: 16px; display: flex; align-items: center; gap: 14px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BDBAB3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 13px; color: #A3A19B">達成するマイルストーン</span>
<span style="font-weight: 500">{{ unit.milestone }}</span>
</span>
</div>
</div>
</sc-if>


<sc-if value="{{ show.course }}" hint-placeholder-val="{{ false }}">
<div class="crspg" style="padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="en" style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.1">{{ crs.name }}</h1>
</div>

<div id="progTree"></div>
</div>
</sc-if>


<sc-if value="{{ show.news }}" hint-placeholder-val="{{ false }}">
<div style="padding: 6px 20px 48px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">ニュース</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 class="h2">マーケット</h2>
<button onClick="{{ mk.openEdit }}" style="height: 34px; padding: 0 12px; border: 1px solid #383836; border-radius: 6px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 700">編集</button>
</div>
<div class="scroll" style="display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{ mk.tiles }}" as="m" hint-placeholder-count="4">
<div class="card" style="flex: none; width: 184px; overflow: hidden; position: relative">
<div style="padding: 10px 12px 0; font-size: 12px; color: #A3A19B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.name }}</div>
<div class="tv" ref="{{ m.ref }}" style="height: 150px; padding: 0 2px"></div>
<button class="tvhit" onClick="{{ m.open }}" aria-label="{{ m.name }}の詳細"></button>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<h2 class="h2">今日の記事</h2>
<div class="scroll" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{ newsFilters }}" as="f" hint-placeholder-count="5">
<button onClick="{{ f.pick }}" class="chip" style="flex: none; height: 44px; padding: 0 14px; background: {{ f.bg }}; color: {{ f.fg }}; border-color: {{ f.bd }}">{{ f.name }}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 0; border-top: 1px solid #252524; margin: 0 -20px; padding: 0 20px">

<sc-for list="{{ newsItems }}" as="w" hint-placeholder-count="4">
<button onClick="{{ w.open }}" style="display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; padding: 20px; color: #F3F1EC; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span style="display: flex; align-items: center; gap: 8px"><span class="chip">{{ w.tag }}</span><span style="font-size: 13px; font-weight: 700; color: #F2A93B">{{ w.fitWhy }}</span></span>
<span style="font-size: 13px; color: #A3A19B">{{ w.time }}</span>
</div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.4; word-break: auto-phrase">{{ w.title }}</div>
<div style="font-size: 14px; color: #BDBAB3; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{ w.sum }}</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 12px; width: 100%; padding-top: 10px; border-top: 0; font-size: 13px; color: #A3A19B">
<span style="white-space: nowrap">出典：{{ w.src }}</span>
<span style="white-space: nowrap">コメント {{ w.cm }}件</span>
</div>
</button>
</sc-for>
</div>
</div>
</div>
</sc-if>


<sc-if value="{{ show.board }}" hint-placeholder-val="{{ false }}">
<div style="padding: 6px 20px 120px; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">掲示板</h1>
<div style="position: sticky; top: 0; z-index: 10; background: #070707; margin: -6px -20px 0; padding: 6px 20px 8px; border-bottom: 1px solid #171716">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #131313; border: 1px solid #252524; border-radius: 8px">
<button onClick="{{ segRecruit }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.rBg }}; color: {{ seg.rFg }}">アイデア</button>
<button onClick="{{ segPain }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.pBg }}; color: {{ seg.pFg }}">ペイン</button>
<button onClick="{{ segEvent }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.eBg }}; color: {{ seg.eFg }}">イベント</button>
<button onClick="{{ segOther }}" style="height: 40px; border: 0; border-radius: 6px; font-weight: 700; font-size: 15px; background: {{ seg.oBg }}; color: {{ seg.oFg }}">その他</button>
</div>
</div>

<sc-if value="{{ show.recruit }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<button onClick="{{ dd.b.tg }}" aria-expanded="{{ dd.b.open }}" style="align-self: flex-start; height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #383836; border-radius: 8px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg><span>種類：<b style="color: #F3F1EC; font-weight: 700">{{ dd.b.cur }}</b></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ dd.b.rot }}); transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ dd.b.open }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; min-width: 200px; padding: 4px 0; background: #191918; border: 1px solid #383836; border-radius: 8px">
<sc-for list="{{ dd.b.items }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="width: 100%; height: 42px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: transparent; border: 0; color: #F3F1EC; font-size: 14px; text-align: left">{{ o.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ o.chk }}"><path d="M5 12l5 5 9-10"></path></svg></button>
</sc-for>
</div>
</sc-if>
</div>
<sc-for list="{{ feed }}" as="r" hint-placeholder-count="4">
<sc-if value="{{ r.isRecruit }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ r.open }}" style="display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; padding: 16px; color: #F3F1EC; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span class="chip" style="gap: 5px; background: transparent; border-color: rgba(242,169,59,0.6); color: #F2A93B"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 15c1.6.6 2.6 2.2 3 5"></path></svg>メンバー募集</span>
<span style="font-size: 13px; color: #A3A19B">{{ r.frame }} · {{ r.time }}</span>
</div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.4; word-break: auto-phrase">{{ r.title }}</div>
<div style="font-size: 13px; color: #BDBAB3">{{ r.owner }}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ r.slots }}" as="s" hint-placeholder-count="3">
<span class="chip en" style="border-color: {{ s.bd }}; color: {{ s.fg }}; background: {{ s.bg }}">{{ s.role }} · {{ s.label }}</span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 10px; border-top: 0; font-size: 13px; color: #A3A19B">
<span>解散条件：{{ r.endShort }}</span>
<span>FB {{ r.fb }}</span>
</div>
</button>
</sc-if>
<sc-if value="{{ r.isIdea }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ r.open }}" style="display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; padding: 16px; color: #F3F1EC; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span class="chip" style="gap: 5px; border-color: #F3F1EC; color: #F3F1EC"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>意見募集</span>
<span style="font-size: 13px; color: #A3A19B">{{ r.time }}</span>
</div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.4; word-break: auto-phrase">{{ r.title }}</div>
<div style="font-size: 14px; color: #D2CFC8; line-height: 1.6">{{ r.summary }}</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{ r.asks }}" as="q" hint-placeholder-count="2">
<span style="display: flex; gap: 8px; font-size: 13px; color: #E9E6DF"><span class="en" style="color: #7D7B76; font-weight: 700">Q</span>{{ q.text }}</span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 10px; border-top: 0; font-size: 13px; color: #A3A19B">
<span>{{ r.owner }}</span>
<span>意見 {{ r.fb }} · 回答 {{ r.votes }}</span>
</div>
</button>
</sc-if>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ show.pain }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 0">
<div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px">
<button onClick="{{ dd.ps.tg }}" aria-expanded="{{ dd.ps.open }}" style="align-self: flex-start; height: 38px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid #383836; border-radius: 8px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"></path></svg><span>並び順：<b style="color: #F3F1EC; font-weight: 700">{{ dd.ps.cur }}</b></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ dd.ps.rot }}); transition: transform 0.15s"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ dd.ps.open }}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; min-width: 200px; padding: 4px 0; background: #191918; border: 1px solid #383836; border-radius: 8px">
<sc-for list="{{ dd.ps.items }}" as="o" hint-placeholder-count="3">
<button onClick="{{ o.pick }}" style="width: 100%; height: 42px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: transparent; border: 0; color: #F3F1EC; font-size: 14px; text-align: left">{{ o.name }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{ o.chk }}"><path d="M5 12l5 5 9-10"></path></svg></button>
</sc-for>
</div>
</sc-if>
</div>
<sc-for list="{{ pains }}" as="p" hint-placeholder-count="4">
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; background: transparent; border: 0; border-bottom: 1px solid #252524; border-radius: 0; margin-left: -20px; margin-right: -20px; width: calc(100% + 40px); padding: 26px 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span class="chip">{{ p.src }}</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #A3A19B">深刻度
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{ p.d1 }}"></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{ p.d2 }}"></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: {{ p.d3 }}"></span>
</span>
</div>
<div style="font-weight: 700; font-size: 16px; line-height: 1.45; word-break: auto-phrase">{{ p.text }}</div>
<div style="font-size: 13px; color: #BDBAB3">困っている人：{{ p.who }}</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="2"><span style="font-size: 13px; color: #BDBAB3">#{{ t.name }}</span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 0">
<button onClick="{{ p.toggle }}" aria-label="共感する" style="height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid {{ p.empBd }}; background: {{ p.empBg }}; color: {{ p.empFg }}; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
<span>自分も {{ p.count }}</span>
</button>
<span style="font-size: 13px; color: {{ p.ideaColor }}">派生アイデア {{ p.ideas }}</span>
</div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ show.event }}" hint-placeholder-val="{{ false }}">

</div>
</sc-if>

<sc-if value="{{ show.npRecruit }}" hint-placeholder-val="{{ false }}">

</div>

</div>

<button onClick="{{ o.pick }}" style="height: 46px; border-radius: 8px; border: 1px solid {{ o.bd }}; background: {{ o.bg }}; color: {{ o.fg }}; font-weight: 500; font-size: 14px; text-align: left; padding: 0 14px">{{ o.name }}</button>

</div>

</div>

<sc-if value="{{ show.eventNew }}" hint-placeholder-val="{{ false }}">

<span class="lbl">種類</span>

<sc-for list="{{ enTypes }}" as="o" hint-placeholder-count="4">
<button onClick="{{ o.pick }}" style="height: 44px; border-radius: 8px; border: 1px solid {{ o.bd }}; background: {{ o.bg }}; color: {{ o.fg }}; font-weight: 700; font-size: 13px; padding: 0">{{ o.name }}</button>
</sc-for>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">タイトル</span><input id="enTitle" type="text" placeholder="例：学生起業家ミートアップ" style="height: 48px; padding: 0 14px; background: #131313; border: 1px solid #383836; border-radius: 8px; color: #F3F1EC; font-size: 15px"></label>

</div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">リンク</span><input id="enUrl" type="url" placeholder="https://" style="height: 48px; padding: 0 14px; background: #131313; border: 1px solid #383836; border-radius: 8px; color: #F3F1EC; font-size: 15px"></label>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">向いている職能</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<sc-for list="{{ npRoles }}" as="o" hint-placeholder-count="6">
<button onClick="{{ o.pick }}" class="chip en" style="height: 40px; padding: 0 12px; border-color: {{ o.bd }}; color: {{ o.fg }}; background: {{ o.bg }}">{{ o.name }}</button>
</sc-for>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">ひとこと</span><textarea id="enNote" rows="3" placeholder="おすすめの理由、参加した感想など" style="padding: 14px; resize: none; background: #131313; border: 1px solid #383836; border-radius: 8px; color: #F3F1EC; font-size: 15px"></textarea></label>
<div style="font-size: 13px; color: #A3A19B; line-height: 1.6">部員投稿として掲載されます。渉外局が確認すると「公式」になります。</div>

</div>
</sc-if>


<sc-if value="{{ show.newsDetail }}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 6px"><span class="chip">{{ curNews.tag }}</span><span class="chip">{{ curNews.time }}</span></div>
<h1 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.4; word-break: auto-phrase">{{ curNews.title }}</h1>
</div>

<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span class="lbl">AIによる要約</span>
<div style="font-size: 15px; line-height: 1.75; color: #E9E6DF">{{ curNews.sum }}</div>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #252524; font-size: 13px; color: #A3A19B">
<span>出典：{{ curNews.src }}</span>
<span style="display: flex; align-items: center; gap: 2px; color: #F3F1EC; font-weight: 700">原文を読む<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</div>
</div>


<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 class="h2">コメント</h2>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<input type="text" aria-label="コメントを書く" placeholder="思ったことを一言" style="flex: 1; min-width: 0; height: 46px; padding: 0 16px; background: #131313; border: 1px solid #383836; border-radius: 6px; color: #F3F1EC; font-size: 15px">
<button aria-label="送信" style="flex: none; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: #F3F1EC; color: #070707; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{ newsCm }}" as="c" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 14px 0; border-bottom: {{ c.sep }}">
<span class="en" style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #2C2C2A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{ c.ini }}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #A3A19B">{{ c.who }} · {{ c.time }}</span>
<span style="font-size: 15px; line-height: 1.65; color: #E9E6DF">{{ c.text }}</span>
<div style="display: flex; align-items: center; gap: 12px">
<button onClick="{{ c.toggle }}" aria-label="いいね" style="height: 40px; padding: 0 4px 0 0; border: 0; background: transparent; color: {{ c.likeFg }}; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ c.likeFill }}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><span class="en">{{ c.likeN }}</span></button>
<button style="height: 40px; padding: 0 4px; border: 0; background: transparent; color: #A3A19B; font-size: 13px; font-weight: 700">返信</button>
</div>
<sc-for list="{{ c.replies }}" as="r" hint-placeholder-count="1">
<div style="display: flex; gap: 10px; padding-top: 8px">
<span class="en" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #2C2C2A; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ r.ini }}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #A3A19B">{{ r.who }} · {{ r.time }}</span>
<span style="font-size: 15px; line-height: 1.6; color: #E9E6DF">{{ r.text }}</span>
</div>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
<sc-if value="{{ noNewsCm }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 14px; color: #A3A19B; padding: 4px 0">まだコメントはありません。</div>
</sc-if>
</div>

</div>
</sc-if>


<sc-if value="{{ show.mk }}" hint-placeholder-val="{{ false }}">

<div style="display: flex; flex-direction: column; gap: 6px">

<p style="margin: 0; font-size: 15px; line-height: 1.75; color: #E9E6DF">{{ mk.what }}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 class="h2">起業との関係</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.75; color: #E9E6DF">{{ mk.why }}</p>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ show.mkEdit }}" hint-placeholder-val="{{ false }}">

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{ r.name }}</span><span class="en" style="font-size: 12px; color: #A3A19B">{{ r.code }}</span></span>
<button onClick="{{ r.up }}" disabled="{{ r.upDis }}" aria-label="上へ" style="flex: none; width: 36px; height: 36px; padding: 0; border: 1px solid #383836; border-radius: 6px; background: transparent; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button onClick="{{ r.dn }}" disabled="{{ r.dnDis }}" aria-label="下へ" style="flex: none; width: 36px; height: 36px; padding: 0; border: 1px solid #383836; border-radius: 6px; background: transparent; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button onClick="{{ r.rm }}" disabled="{{ r.rmDis }}" aria-label="削除" style="flex: none; width: 36px; height: 36px; padding: 0; border: 1px solid #383836; border-radius: 6px; background: transparent; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{ mk.presets }}" as="p" hint-placeholder-count="6">
<button onClick="{{ p.add }}" disabled="{{ p.dis }}" style="height: 36px; padding: 0 12px; border: 1px solid #383836; border-radius: 6px; background: transparent; color: #D2CFC8; font-size: 13px">{{ p.label }}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
<input id="mkCode" type="text" aria-label="銘柄コード" placeholder="銘柄コード（例：FX:EURJPY）" autocapitalize="characters" autocomplete="off" style="grid-column: span 2; height: 44px; padding: 0 12px; background: #131313; border: 1px solid #383836; border-radius: 6px; color: #F3F1EC; font-size: 15px">
<input id="mkName" type="text" aria-label="表示名" placeholder="表示名" autocomplete="off" style="height: 44px; padding: 0 12px; background: #131313; border: 1px solid #383836; border-radius: 6px; color: #F3F1EC; font-size: 15px; min-width: 0">
<button onClick="{{ mk.addCustom }}" style="height: 44px; border: 0; border-radius: 6px; background: #F3F1EC; color: #070707; font-weight: 700; font-size: 15px">追加</button>
</div>
<span style="font-size: 13px; color: #F2A93B">{{ mk.msg }}</span>
<span style="font-size: 13px; color: #A3A19B">日本の個別株と、日経平均の指数そのものは表示できません。</span>
</div>
<button onClick="{{ mk.reset }}" style="align-self: flex-start; height: 40px; padding: 0 14px; border: 1px solid #383836; border-radius: 6px; background: transparent; color: #D2CFC8; font-size: 13px; font-weight: 700">初期の銘柄に戻す</button>
</div>
</sc-if>


<sc-if value="{{ show.cal }}" hint-placeholder-val="{{ false }}">
<div style="padding: 6px 20px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">

<div style="display: flex">

<button class="ibtn" onClick="{{ calNext }}" aria-label="次の月"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>

</div>
<div style="display: flex; gap: 14px; font-size: 13px; color: #BDBAB3">

</div>

(function(){

  var HOLE=/\{\{\s*([^}]+?)\s*\}\}/g, WHOLE=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

    if(path==='true')return true; if(path==='false')return false;

    for(var i=0;i<parts.length;i++){ if(v==null)return undefined; v=v[parts[i]]; }

  }
  function raw(str,sc){ var m=WHOLE.exec(str); if(m)return look(m[1],sc); return interp(str,sc); }
