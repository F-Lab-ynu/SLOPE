<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>SLOPE 運営画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/
</style>
<style id="bootcss">
#boot{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:var(--bootbg);color:var(--bootfg);transition:opacity .28s ease}
#boot.out{opacity:0;pointer-events:none}
.bootlogo{width:46px;height:46px;transform-origin:50% 55%;animation:bootspin 1.6s cubic-bezier(.55,-0.3,.25,1.35) infinite}
@keyframes bootspin{0%{transform:scale(1) rotate(0)}28%{transform:scale(.74) rotate(-28deg)}62%{transform:scale(1.1) rotate(360deg)}76%{transform:scale(.97) rotate(360deg)}88%,100%{transform:scale(1) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bootlogo{animation:bootpulse 1.4s ease-in-out infinite}@keyframes bootpulse{50%{opacity:.4}}}
</style>
</head>
<body>
<div id="boot" role="status" aria-label="読み込み中" style="--bootbg:#ffffff;--bootfg:#111827"><svg class="bootlogo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.5c5-1.4 13-1.4 18 0-.6 1.3-1.5 2.2-2.6 2.6-4.3-.7-8.5-.7-12.8 0C4.5 6.7 3.6 5.8 3 4.5z" fill="currentColor"/><path d="M7.3 9.2l7.2-.3-.6 1.9 3.6-.1-2.4 3.4-3.3.1L9.3 21z" fill="currentColor"/></svg></div>
<script>(function(){function done(){var b=document.getElementById("boot");if(!b||document.documentElement.getAttribute("data-prod"))return;b.classList.add("out");setTimeout(function(){b.remove()},320)}window.__bootDone=function(){var b=document.getElementById("boot");if(!b)return;b.classList.add("out");setTimeout(function(){b.remove()},320)};if(document.readyState==="complete")setTimeout(done,150);else window.addEventListener("load",function(){setTimeout(done,150)})})();</script>

<div class="app">
  <aside class="side">
    <div class="brand"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.5c5-1.4 13-1.4 18 0-.6 1.3-1.5 2.2-2.6 2.6-4.3-.7-8.5-.7-12.8 0C4.5 6.7 3.6 5.8 3 4.5z" fill="#111827"/><path d="M7.3 9.2l7.2-.3-.6 1.9 3.6-.1-2.4 3.4-3.3.1L9.3 21z" fill="#111827"/></svg>SLOPE <small>運営</small></div>
    <nav class="nav" id="nav" aria-label="運営メニュー"></nav>
    <div class="acct" id="acct"></div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>
<script>
//@@JS@@
</script>
<script>
document.addEventListener('click',function(e){
  var sw=e.target.closest&&e.target.closest('.msw'); if(!sw)return;
  e.preventDefault(); e.stopPropagation(); sw.classList.toggle('on');
  setTimeout(function(){ location.replace(sw.dataset.to); },170);
},true);
</script>
</body>
</html>
